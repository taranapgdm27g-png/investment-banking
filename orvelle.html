<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORVELLE store and studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#F3F2F7;--surface:#FFFFFF;--surface2:#F8F7FB;--wall:#FBFAFD;--ink:#2B1D2F;--ink2:#5E5364;--ink3:#8C8392;--line:#E4E1EA;--brand:#7A1F3D;--brandInk:#FFFFFF;--brandSoft:#F4E3E8;--offer:#F2B33D;--offerInk:#3A2600;--ok:#1E7A55;--warn:#A86200;--bad:#B3261E;--c1:#7A1F3D;--c2:#3553C6;--c3:#1E7A55;--c4:#E0A12E;--c5:#8E6CCF;--c6:#2B8C93;--shadow:0 18px 40px -18px rgba(60,20,50,.35);--display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#17121A;--surface:#221B26;--surface2:#2A2230;--wall:#2A2230;--ink:#F3ECF5;--ink2:#C3B8C7;--ink3:#94889B;--line:#3A3040;--brand:#E27D9C;--brandInk:#2B1D2F;--brandSoft:#3D2230;--offer:#F2B33D;--offerInk:#2B1D00;--ok:#5FCB98;--warn:#F0A94A;--bad:#FF8A80;--c1:#E27D9C;--c2:#8AA4FF;--c3:#5FCB98;--c4:#F2C14E;--c5:#B9A0F0;--c6:#62C6CC;--shadow:0 18px 40px -18px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#17121A;--surface:#221B26;--surface2:#2A2230;--wall:#2A2230;--ink:#F3ECF5;--ink2:#C3B8C7;--ink3:#94889B;--line:#3A3040;--brand:#E27D9C;--brandInk:#2B1D2F;--brandSoft:#3D2230;--offer:#F2B33D;--offerInk:#2B1D00;--ok:#5FCB98;--warn:#F0A94A;--bad:#FF8A80;--c1:#E27D9C;--c2:#8AA4FF;--c3:#5FCB98;--c4:#F2C14E;--c5:#B9A0F0;--c6:#62C6CC;--shadow:0 18px 40px -18px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--canvas);color:var(--ink);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
.disp{font-family:var(--display);font-stretch:80%;font-weight:720;letter-spacing:-.02em;line-height:.96}
h1,h2,h3{margin:0}h2.disp{font-size:clamp(28px,4vw,44px)}h3{font:600 18px/1.25 var(--ui)}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:13px}.tiny{font-size:12px}.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapx{flex-wrap:wrap}.grow{flex:1}.col{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;text-decoration:none;background:var(--brand);color:var(--brandInk);transition:transform .15s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}.btn.soft{background:var(--brandSoft);color:var(--brand)}.btn.plain{background:transparent;color:var(--ink);padding:8px 10px}.btn.sm{padding:7px 14px;font-size:13px}.btn.block{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ibtn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink)}
.ibtn:hover{background:var(--surface2)}.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:var(--brandInk);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}.chip .sw{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.scrollx::-webkit-scrollbar{display:none}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:none}span.field{display:inline-flex;align-items:center}
input.field:focus,select.field:focus{border-color:var(--ink)}label.lab{font-size:13px;font-weight:600;color:var(--ink2);display:block;margin:0 0 6px}
/* nav */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}.logo{font-family:var(--display);font-stretch:100%;font-weight:560;letter-spacing:.2em;font-size:19px;text-decoration:none}
.nav{display:none;gap:4px}.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:500}.nav a.on,.nav a:hover{background:var(--surface)}
.search{flex:1;max-width:340px;display:none;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 14px;height:40px}.search input{border:0;background:transparent;outline:none;width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;text-decoration:none;color:var(--ink3);padding:4px 0;position:relative}.tabbar a.on{color:var(--brand)}
main.store{padding-bottom:90px;min-height:70vh}
@media (min-width:900px){.nav,.search{display:flex}.tabbar{display:none}main.store{padding-bottom:40px}.mob{display:none!important}}
@media (max-width:899px){.desk{display:none!important}}
/* product card */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1100px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
.pc{position:relative;text-decoration:none;display:block;perspective:900px}
.pc .ph{position:relative;background:var(--wall);border-radius:16px;overflow:hidden;aspect-ratio:200/300;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.pc .ph svg{position:absolute;inset:0;width:100%;height:100%}
.pc.tilting .ph{transition:none;box-shadow:var(--shadow)}
.pc .heart{position:absolute;top:8px;right:8px;z-index:3;background:color-mix(in srgb,var(--surface) 85%,transparent)}
.pc .tag{position:absolute;left:10px;top:10px;z-index:3;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--ink)}
.pc .tag.sale{background:var(--offer);color:var(--offerInk)}
.pc .meta{padding:9px 2px 0}.pc .nm{font-weight:600;font-size:14.5px;line-height:1.3}.price{font-weight:700}.mrp{color:var(--ink3);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:500}.off{color:var(--ok);font-size:13px;font-weight:700;margin-left:6px}
.dots{display:flex;gap:4px;margin-top:5px}.dots i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
/* hero ring */
.hero{display:grid;gap:28px;padding:34px 0 20px;align-items:center}@media(min-width:900px){.hero{grid-template-columns:1fr 1.05fr;padding:56px 0 36px}}
.hero h1{font-size:clamp(46px,7.4vw,96px)}.hero p.lead{font-size:18px;max-width:34ch;color:var(--ink2);margin:18px 0 24px}
.ringwrap{height:clamp(340px,50vw,560px);perspective:1400px;position:relative;touch-action:pan-y;cursor:grab;user-select:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 13%,#000 87%,transparent);mask-image:linear-gradient(90deg,transparent,#000 13%,#000 87%,transparent)}
.ring{position:absolute;left:50%;top:48%;width:0;height:0;transform-style:preserve-3d}
.ring .it{position:absolute;width:clamp(132px,16.5vw,224px);aspect-ratio:200/300;left:0;top:0;transform-style:preserve-3d;border-radius:14px;overflow:hidden;background:var(--wall);box-shadow:var(--shadow);backface-visibility:hidden}
.ring .it svg{width:100%;height:100%;display:block}
.floorline{position:absolute;left:8%;right:8%;bottom:10px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(43,29,47,.18),transparent)}
/* sections */
section.blk{padding:34px 0}.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cat{position:relative;border-radius:999px 999px 18px 18px;overflow:hidden;text-decoration:none;aspect-ratio:3/4.2;display:block}
.cat .figs{position:absolute;inset:0 0 clamp(34px,5vw,58px) 0;display:flex;align-items:end;justify-content:center}.cat .figs svg{height:94%;width:auto;margin:0 -9%}
.cat .lbl{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--display);font-stretch:80%;font-weight:720;font-size:clamp(20px,3vw,34px);color:#2B1D2F}
.styles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.styles::-webkit-scrollbar{display:none}
.stc{border-radius:16px;overflow:hidden;background:var(--surface);text-decoration:none;display:block;border:1.5px solid var(--line)}.stc .ph{aspect-ratio:1/1.05;position:relative;overflow:hidden}.stc .ph svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:118%}.stc .tx{padding:10px 12px}.stc.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.appband{display:grid;gap:22px;align-items:center;background:var(--ink);color:var(--canvas);border-radius:28px;padding:28px;overflow:hidden}@media(min-width:900px){.appband{grid-template-columns:1.1fr .9fr;padding:44px}}
:root[data-theme="dark"] .appband{background:var(--surface2);color:var(--ink)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .appband{background:var(--surface2);color:var(--ink)}}
.phone{width:240px;height:490px;border-radius:38px;background:#141016;padding:10px;margin:0 auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);position:relative}
.phone .scr{width:100%;height:100%;border-radius:30px;background:var(--canvas);overflow:hidden;position:relative;color:var(--ink)}
.offerbar{display:flex;align-items:center;gap:10px;background:var(--offer);color:var(--offerInk);padding:9px 14px;border-radius:14px;font-weight:600;font-size:14px}
.offerbar code{background:rgba(255,255,255,.55);padding:2px 8px;border-radius:6px;font-weight:700;font-family:var(--ui)}
footer.ft{border-top:1px solid var(--line);padding:30px 0 110px;margin-top:30px}@media(min-width:900px){footer.ft{padding-bottom:40px}}
/* shop */
.shop{display:grid;gap:22px;padding-top:18px}@media(min-width:900px){.shop{grid-template-columns:250px 1fr}}
.filters{display:none}@media(min-width:900px){.filters{display:block;position:sticky;top:78px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:6px}}
.fgroup{border-bottom:1px solid var(--line);padding:12px 0}.fgroup h4{margin:0 0 9px;font-size:13.5px;font-weight:700}
.fopts{display:flex;flex-wrap:wrap;gap:6px}.fopts .chip{padding:5px 11px;font-size:13px}
.swatch{width:28px;height:28px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);position:relative}.swatch.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
input[type=range]{width:100%;accent-color:var(--brand)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,20,.45);z-index:60;animation:fade .2s}.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:900px){.sheet{left:auto;top:0;width:420px;max-height:none;border-radius:22px 0 0 22px;animation:side .28s cubic-bezier(.2,.8,.2,1)}}
@keyframes up{from{transform:translateY(100%)}}@keyframes side{from{transform:translateX(100%)}}@keyframes fade{from{opacity:0}}
/* pdp */
.pdp{display:grid;gap:26px;padding-top:18px}@media(min-width:900px){.pdp{grid-template-columns:1.05fr 1fr;gap:44px}}
.stage{position:relative;border-radius:22px;background:var(--wall);aspect-ratio:1/1.12;overflow:hidden;perspective:1100px;touch-action:pan-y;user-select:none;cursor:grab}
.stage .archbg{position:absolute;left:16%;right:16%;top:9%;bottom:0;border-radius:999px 999px 0 0}
.stage .turn{position:absolute;left:0;right:0;top:4%;bottom:5%;transform-style:preserve-3d}
.stage .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;justify-content:center}.stage .face svg{height:100%;width:auto}.stage .face.bk{transform:rotateY(180deg)}
.stage .shadow{position:absolute;left:50%;bottom:4%;width:40%;height:22px;margin-left:-20%;border-radius:50%;background:radial-gradient(closest-side,rgba(43,29,47,.28),transparent)}
.stage .hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.sizes{display:flex;flex-wrap:wrap;gap:8px}.size{min-width:50px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}.size.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.bar5{display:grid;grid-template-columns:22px 1fr 36px;gap:8px;align-items:center;font-size:12.5px}.bar5 i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar5 i b{display:block;height:100%;background:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}.qty button{border:0;background:transparent;width:34px;height:34px;font-size:18px}
.line{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.line .ph{border-radius:12px;overflow:hidden;background:var(--wall);aspect-ratio:200/280;position:relative}.line .ph svg{position:absolute;inset:0;width:100%;height:100%}
.sum div{display:flex;justify-content:space-between;padding:5px 0}.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:left}.opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
/* onboarding */
.ob{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--canvas)}.obcard{width:100%;max-width:440px;background:var(--surface);border-radius:28px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.appicon{width:78px;height:78px;border-radius:20px;background:var(--ink);color:var(--canvas);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:38px;font-stretch:80%}
.otp{display:flex;gap:10px}.otp input{width:56px;height:60px;text-align:center;font-size:24px;font-weight:700;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.catpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.catpick button{border:1.5px solid var(--line);background:var(--wall);border-radius:999px 999px 16px 16px;padding:0;overflow:hidden;aspect-ratio:3/4.6;position:relative}.catpick button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}.catpick button svg{position:absolute;inset:0 0 26px 0;width:100%;height:calc(100% - 26px)}.catpick button span{position:absolute;bottom:6px;left:0;right:0;font-weight:700}
.stylepick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stylepick .stc .ph{aspect-ratio:1/.8}
.ring-prog{width:84px;height:84px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--canvas);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .25s;max-width:92vw;text-align:center}@media(min-width:900px){.toast{bottom:28px}}
.empty{text-align:center;padding:50px 20px}.empty svg.icon{width:40px;height:40px;color:var(--ink3)}
/* admin */
.adm{display:grid;min-height:100vh}@media(min-width:1000px){.adm{grid-template-columns:232px 1fr}}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}@media(max-width:999px){.side{position:sticky;top:0;z-index:20;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.side .sgrp,.side .brandx{display:none}}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap}.side a.on{background:var(--ink);color:var(--surface)}.side a:not(.on):hover{background:var(--surface2)}.sgrp{font-size:12px;color:var(--ink3);padding:12px 12px 4px;font-weight:600}
.amain{padding:18px clamp(14px,2.4vw,28px) 60px;min-width:0}.abar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 1.8s infinite}.live-dot.off{background:var(--ink3);animation:none}@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}@media(min-width:760px){.kpis{grid-template-columns:repeat(3,1fr)}}@media(min-width:1200px){.kpis.k6{grid-template-columns:repeat(6,1fr)}.kpis.k5{grid-template-columns:repeat(5,1fr)}.kpis.k4{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}.kpi .v{font:700 24px/1.1 var(--ui);font-variant-numeric:tabular-nums;margin:4px 0 2px}.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:600}.kpi .d{font-size:12px;color:var(--ink3)}.up{color:var(--ok)}.dn{color:var(--bad)}
.agrid{display:grid;gap:16px;margin-top:16px}@media(min-width:1100px){.agrid.two{grid-template-columns:1.35fr 1fr}.agrid.half{grid-template-columns:1fr 1fr}.agrid.three{grid-template-columns:repeat(3,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}.box h3{font-size:15.5px;margin-bottom:2px}.box .sub{font-size:12.5px;color:var(--ink3);margin-bottom:12px}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}table.t th{text-align:left;font-size:12px;color:var(--ink3);font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}table.t td{padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}table.t td.r,table.t th.r{text-align:right}table.t tr:last-child td{border-bottom:0}table.t tr.hl td{background:color-mix(in srgb,var(--ok) 9%,transparent)}
.seg{display:inline-flex;align-items:center;gap:6px;font-weight:600}.seg i{width:9px;height:9px;border-radius:50%;display:inline-block}
